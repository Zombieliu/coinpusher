services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: oops-coinpusher-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: coinpusher_game
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - oops-coinpusher-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/coinpusher_game --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Gate 服务器
  gate-server:
    build:
      context: ./tsrpc_server
      dockerfile: Dockerfile.gate
    container_name: oops-coinpusher-gate
    restart: unless-stopped
    ports:
      - "32000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - PORT=3000
      - DB_NAME=coinpusher_game
      - COLLECTION_NAME=users
      - DRAGONFLY_URL=redis://dragonflydb:6379
      # Stripe 支付（请在部署环境中填入真实值，避免把密钥提交到仓库）
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?missing_STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?missing_STRIPE_WEBHOOK_SECRET}
      # 使用根路径 query（Stripe 不允许 fragment）；静态服会返回 index.html
      - STRIPE_SUCCESS_URL=http://localhost:7457/?orderId={ORDER_ID}&sessionId={CHECKOUT_SESSION_ID}&userId={USER_ID}&stripe-success=1
      - STRIPE_CANCEL_URL=http://localhost:7457/?orderId={ORDER_ID}&userId={USER_ID}&stripe-cancel=1
    depends_on:
      mongodb:
        condition: service_healthy
      dragonflydb:
        condition: service_started
    networks:
      - oops-coinpusher-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Match 服务器
  match-server:
    build:
      context: ./tsrpc_server
      dockerfile: Dockerfile.match
    container_name: oops-coinpusher-match
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - PORT=3001
      - DISABLE_IP_WHITELIST=true
    depends_on:
      - gate-server
    networks:
      - oops-coinpusher-network

  # Room 服务器
  room-server:
    build:
      context: ./tsrpc_server
      dockerfile: Dockerfile.room
    container_name: oops-coinpusher-room
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - PORT=3002
      - SERVER_URL_MATCH=http://match-server:3001
      - MATCH_INTERNAL_URL=http://match-server:3001
      - GATE_URL=http://gate-server:3000
      # 客户端访问房间 WebSocket 的外网地址（本地开发走宿主机端口映射）
      # - SERVER_URL_ROOM=ws://127.0.0.1:3002/
      # - SERVER_URL_ROOM=ws://192.168.50.57:3002/
      - SERVER_URL_ROOM=ws://192.168.50.197:3002/
      - RUST_ROOM_ENABLED=true
      - RUST_ROOM_HOST=physics-worker
      - RUST_ROOM_PORT=9000
      - DISABLE_IP_WHITELIST=true
      - INTERNAL_SECRET_KEY=local-dev-secret-1234567890abcdef
      - ENABLE_SNAPSHOT_SIGNATURE=false
    depends_on:
      - match-server
      - physics-worker
    networks:
      - oops-coinpusher-network

  physics-worker:
    build:
      context: ./physics-worker
      dockerfile: Dockerfile
    container_name: oops-coinpusher-physics
    restart: unless-stopped
    ports:
      - "39000:9000"
    networks:
      - oops-coinpusher-network

  # 管理后台
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: oops-coinpusher-admin
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://gate-server:3000
    depends_on:
      - gate-server
    networks:
      - oops-coinpusher-network

  dragonflydb:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: oops-coinpusher-dragonfly
    restart: unless-stopped
    command: ["--logtostderr"]
    ports:
      - "6379:6379"
    networks:
      - oops-coinpusher-network

networks:
  oops-coinpusher-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
