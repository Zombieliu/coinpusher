# Alertmanager 配置
# 告警路由和通知配置

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.larksuite.com:587'
  smtp_from: 'alerts@obelisk.build'
  smtp_auth_username: 'alerts@obelisk.build'
  smtp_auth_password: '1sUIPN3Vh3CZxG4d'
  smtp_hello: 'obelisk.build'
  # 若需强制使用 TLS，可取消下一行注释
  # smtp_require_tls: true

# 告警路由规则
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s          # 等待10秒收集同一组的告警
  group_interval: 10s      # 同一组告警的发送间隔
  repeat_interval: 12h     # 重复告警的间隔

  # 子路由
  routes:
    # 严重告警立即发送
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m

    # 警告级别告警
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 30m

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:8080/alerts/webhook'

  # 严重告警接收器
  - name: 'critical-alerts'
    # Slack 通知
    slack_configs:
      - channel: '#alerts-critical'
        title: '🚨 严重告警'
        text: |
          *告警*: {{ .CommonAnnotations.summary }}
          *描述*: {{ .CommonAnnotations.description }}
          *服务*: {{ .CommonLabels.service }}
          *时间*: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
        send_resolved: true

    # Email 通知 (需要配置 SMTP)
    email_configs:
      - to: 'henry@obelisk.build'
        from: 'alerts@obelisk.build'
        smarthost: 'smtp.larksuite.com:587'
        auth_username: 'alerts@obelisk.build'
        auth_identity: 'alerts@obelisk.build'
        auth_password: '1sUIPN3Vh3CZxG4d'
        headers:
          Subject: '🚨 严重告警 - Coin Pusher Game'

    # Webhook 通知
    webhook_configs:
      - url: 'http://localhost:8080/alerts/critical'

  # 警告级别接收器
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#alerts-warning'
        title: '⚠️ 警告告警'
        text: |
          *告警*: {{ .CommonAnnotations.summary }}
          *描述*: {{ .CommonAnnotations.description }}
          *服务*: {{ .CommonLabels.service }}
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  # 如果服务下线，抑制该服务的其他告警
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['job', 'instance']

  # 如果有严重告警，抑制警告级别告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
